# Datenbank: im Dev-/Testmodus startet Quarkus Dev Services automatisch einen
# PostgreSQL-Container (Docker/Podman nötig). Für prod eigene DB eintragen:
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/studentdb
%prod.quarkus.datasource.username=app
%prod.quarkus.datasource.password=app

quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# Security: User und Rollen aus Properties-Files
# Basic Auth muss explizit aktiviert werden (sonst immer 401)
quarkus.http.auth.basic=true
quarkus.security.users.file.enabled=true
quarkus.security.users.file.users=test-users.properties
quarkus.security.users.file.roles=test-roles.properties
quarkus.security.users.file.realm-name=MyRealm
# false = Passwörter als MD5(user:realm:passwort)
quarkus.security.users.file.plain-text=false
