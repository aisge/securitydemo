# Datenbank: H2 In-Memory (kein Docker, keine Installation nötig).
# Im Dev-/Testmodus starten Dev Services die H2 automatisch (ohne URL).
# Im prod-Profil (java -jar ...) ebenfalls In-Memory - Daten gehen beim Beenden verloren.
quarkus.datasource.db-kind=h2
%prod.quarkus.datasource.jdbc.url=jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1

quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# Security: JWT
# Prüfen eingehender Tokens (Public Key)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=https://at.htl.4ahitm
# Signieren neuer Tokens mit Jwt...sign() (Private Key)
# ACHTUNG: Keys NICHT unter META-INF/resources ablegen - wird öffentlich ausgeliefert!
# Der Private Key liegt hier nur als Demo im Repo - in echten Projekten nie committen.
smallrye.jwt.sign.key.location=privateKey.pem
# Gültigkeit neuer Tokens in Sekunden (Default 300)
smallrye.jwt.new-token.lifespan=3600
