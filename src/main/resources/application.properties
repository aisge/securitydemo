# Datenbank: H2 In-Memory (kein Docker, keine Installation nötig).
# Im Dev-/Testmodus starten Dev Services die H2 automatisch (ohne URL).
# Im prod-Profil (java -jar ...) ebenfalls In-Memory - Daten gehen beim Beenden verloren.
quarkus.datasource.db-kind=h2
%prod.quarkus.datasource.jdbc.url=jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1

quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# Security: OpenID Connect mit Keycloak
quarkus.oidc.client-id=quarkus-client
quarkus.oidc.credentials.secret=secret

# Dev-/Testmodus: Dev Services starten Keycloak automatisch (Docker/Podman nötig)
# und importieren den Realm (User max/susi, Passwort passme).
# Fixer Port, damit z.B. ein Angular-Client im Dev-Modus den Issuer kennt.
quarkus.keycloak.devservices.realm-path=quarkus-realm.json
%dev.quarkus.keycloak.devservices.port=8180

# Eigener Keycloak (prod bzw. wenn Dev Services nicht verwendet werden sollen):
# Ist auth-server-url gesetzt, startet Dev Services KEINEN Keycloak.
keycloak.url=http://localhost:8180
%prod.quarkus.oidc.auth-server-url=${keycloak.url}/realms/quarkus-realm

# CORS für Angular-Client
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type
