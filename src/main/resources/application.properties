# Datenbank: H2 In-Memory (kein Docker, keine Installation nötig).
# Im Dev-/Testmodus starten Dev Services die H2 automatisch (ohne URL).
# Im prod-Profil (java -jar ...) ebenfalls In-Memory - Daten gehen beim Beenden verloren.
quarkus.datasource.db-kind=h2
%prod.quarkus.datasource.jdbc.url=jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1

quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.sql-load-script=import.sql

# Security: User und Rollen aus der Datenbank (Tabelle quarkus_user, siehe import.sql)
# Basic Auth muss explizit aktiviert werden (sonst immer 401)
quarkus.http.auth.basic=true
quarkus.security.jdbc.enabled=true

# Variante 1: Passwörter im Klartext
#quarkus.security.jdbc.principal-query.sql=SELECT u.password, u.role FROM quarkus_user u WHERE u.username=?
#quarkus.security.jdbc.principal-query.clear-password-mapper.enabled=true
#quarkus.security.jdbc.principal-query.clear-password-mapper.password-index=1
#quarkus.security.jdbc.principal-query.attribute-mappings.0.index=2
#quarkus.security.jdbc.principal-query.attribute-mappings.0.to=groups

# Variante 2: bcrypt-Hash mit Salt (Werte erzeugen mit GET /passwords/{password})
quarkus.security.jdbc.principal-query.sql=SELECT u.password, u.salt, u.iteration_count, u.role FROM quarkus_user u WHERE u.username=?
quarkus.security.jdbc.principal-query.bcrypt-password-mapper.enabled=true
quarkus.security.jdbc.principal-query.bcrypt-password-mapper.password-index=1
quarkus.security.jdbc.principal-query.bcrypt-password-mapper.salt-index=2
quarkus.security.jdbc.principal-query.bcrypt-password-mapper.iteration-count-index=3
quarkus.security.jdbc.principal-query.attribute-mappings.0.index=4
quarkus.security.jdbc.principal-query.attribute-mappings.0.to=groups
